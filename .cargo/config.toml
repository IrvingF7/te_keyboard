[alias]
knob = "run --quiet -p xtask -- knob"
display = "run --quiet -p xtask -- display"

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[env]
ESP_IDF_VERSION = "v5.3.2"
ESP_IDF_TOOLS_INSTALL_DIR = "global"

