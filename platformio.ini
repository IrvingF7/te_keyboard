[platformio]
; One project builds two separate programs. An "environment" selects the MCU,
; toolchain, source files, and libraries for one of those programs.
; pio run -e knob_test builds only the knob; -e display_test selects the bar.
; Adding -t upload writes the selected program to that board's flash memory.
default_envs = knob_test
src_dir = firmware
boards_dir = T-Display-Bar/boards

[env]
; Shared settings inherited by both environments. The Arduino framework supplies
; setup(), loop(), GPIO helpers, and Serial on top of Espressif's ESP-IDF SDK.
framework = arduino
monitor_speed = 115200
; USB CDC is a virtual serial port here; DTR/RTS are host-side control signals.
; These monitor settings are separate from the application's ESP-NOW radio link.
monitor_dtr = 1
monitor_rts = 0

[env:knob_test]
; Arduino 3.x is needed for ESP32-C6. This release coexists with the
; display's older packages without deleting their versioned installs.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
; The generic DevKit profile has 8 MB; the T-Knob has 4 MB.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv
; src_dir is firmware/, so this includes knob/ and excludes the bar's main.cpp.
; Each build must have its own single pair of setup()/loop() functions.
build_src_filter = +<knob/>
; -D defines preprocessor macros for this build. CDC_ON_BOOT enables USB Serial;
; USB_MODE=1 selects hardware CDC/JTAG, used for flashing/logging, not USB HID.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:display_test]
; Keep the vendor's Arduino 2.0.14 stack for its patched TFT_eSPI.
platform = espressif32 @ 6.5.0
board = lilygo-t-displaybar
; Compile only display/ for the S3; include/ headers are available to both builds.
build_src_filter = +<display/>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    ; Use the checked-out, panel-specific TFT library instead of a generic copy.
    symlink://T-Display-Bar/lib/TFT_eSPI
