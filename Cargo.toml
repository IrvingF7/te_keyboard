[workspace]
resolver = "2"
members = ["crates/keyboard-core", "crates/board-support", "firmware/knob", "firmware/display", "tools/xtask"]
# `cargo test` runs on the PC. Firmware is cross-compiled using the board aliases.
default-members = ["crates/keyboard-core"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
esp-idf-svc = "=0.51.0"
embuild = "=0.33.1"
keyboard-core = { path = "crates/keyboard-core" }
board-support = { path = "crates/board-support" }

[profile.release]
opt-level = 2
debug = 2
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"

